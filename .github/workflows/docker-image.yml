name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push:
        description: "是否推送到镜像仓库"
        required: true
        type: boolean
        default: true
      custom_tag:
        description: "自定义镜像 Tag (可选，留空则根据分支/Tag自动生成)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Docker Image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (可选，需配置 Secrets)
        if: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/xiaomusic', secrets.DOCKERHUB_USERNAME) || '' }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=${{ inputs.custom_tag }},enable=${{ inputs.custom_tag != '' }}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (inputs.push == null || inputs.push == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
